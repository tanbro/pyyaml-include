[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *TestCase Test*
python_functions = test_*
addopts =
    --cov=src/yaml_include
    --cov-report=xml
    --cov-report=term-missing
    --cov-report=html
    --strict-markers
    --tb=short
    -ra
markers =
    unit: Fast unit tests (using mock)
    integration: Integration tests (requiring real resources)
    slow: Slow tests (execution time > 1 second)
    network: Tests requiring network access
filterwarnings =
    ignore::DeprecationWarning
